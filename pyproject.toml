[project]
name = "nurse-epidemic"
version = "0.1.0"
description = "Análise epidemiológica UPA Curitiba — perfil Manchester"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "phik>=0.12.5",
    "plotly>=6.8.0",
    "pyarrow>=18.0.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
    "odfpy>=1.4.1",
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nurse_epidemic"]

[tool.hatch.build.targets.wheel.sources]
"src/nurse_epidemic" = "nurse_epidemic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['E402', 'F811']
